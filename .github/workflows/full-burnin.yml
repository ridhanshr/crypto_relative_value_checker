name: full-burnin

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0"

jobs:
  burnin:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/runtime_burnin.py --stage small
      - run: python scripts/runtime_burnin.py --stage full
      - run: python scripts/validate_artifacts.py reports/burnin
